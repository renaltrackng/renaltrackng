{% load ui %}{% if page.has_other_pages %}<div class="pagination-bar"><span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</span><div>{% if page.has_previous %}<a class="btn btn-light" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">{% icon 'chevron-left' %} Previous</a>{% endif %}{% if page.has_next %}<a class="btn btn-light" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next {% icon 'chevron-right' %}</a>{% endif %}</div></div>{% endif %}
